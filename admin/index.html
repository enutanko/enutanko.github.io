<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>HP更新ページ | えぬﾀﾝｺ</title>
<meta name="theme-color" content="#0b1238">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1b52;--card:rgba(255,255,255,.08);--line:rgba(190,224,255,.35);--sky:#9ad4f2;--ink:#fff;--sub:#b9d3f0;--pri:#bfe0ff;--ng:#ffb3c7}
*{box-sizing:border-box}
html{background:#0b1238}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Zen Maru Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%;
  background:linear-gradient(#1d3a86,#0b1238 70%) fixed;padding:calc(18px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:19px;margin:6px 0 2px;letter-spacing:.05em}
.lead{margin:0 0 18px;font-size:13px;color:var(--sub)}
.screen{display:none}.screen.on{display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;border-radius:20px;border:2px solid var(--line);
  background:var(--card);color:#fff;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.tile i{font-style:normal;font-size:30px}
.tile small{font-weight:500;font-size:11px;color:var(--sub)}
.tile .n{position:absolute;top:8px;right:10px;min-width:22px;height:22px;border-radius:11px;background:#ff7aa2;color:#fff;font-size:12px;line-height:22px;text-align:center;padding:0 6px}
.tile:active{transform:scale(.97)}
.back{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;padding:6px 0;cursor:pointer}
h2{font-size:18px;margin:4px 0 4px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.1);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
select option{color:#000}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;gap:8px;margin-top:10px}
button.b{flex:1;border:0;border-radius:999px;padding:12px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;background:#fff;color:#1d3a86}
button.b.ghost{background:transparent;color:#fff;border:1.5px solid var(--line)}
button.b.ng{background:transparent;color:var(--ng);border:1.5px solid var(--ng)}
button.b.sm{flex:none;padding:7px 12px;font-size:13px}
button.b:disabled{opacity:.5}
.save{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;padding-top:6px}
.save .b{width:100%;box-shadow:0 6px 18px rgba(0,0,0,.35);background:#bfe0ff}
.msg{min-height:20px;font-size:13px;margin:8px 0;color:#bff0cf}.msg.err{color:var(--ng)}
.note{font-size:12px;color:var(--sub);margin:6px 0 12px}
.empty{padding:22px 8px;text-align:center;color:var(--sub);font-size:13px}
.seg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:transparent;color:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#bfe0ff;color:#1d3a86;border-color:#bfe0ff;font-weight:700}
.tools{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.inb{border-left:5px solid #bfe0ff}.inb.done{opacity:.55}
.inb .k{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 10px;background:#bfe0ff;color:#1d3a86;margin-right:6px}
.inb .k.req{background:#ffd9e6}.inb .k.ct{background:#fff2b8}
.inb .t{font-size:11px;color:var(--sub)}
.inb p{margin:6px 0 2px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.cnt{font-size:11px;color:var(--sub);text-align:right}
#key .card{margin-top:30px}
</style>
</head>
<body>
<div class="wrap">

<!-- 合言葉 -->
<section class="screen" id="key">
  <h1>HP更新ページ</h1>
  <p class="lead">ここからHPの内容を更新できます。</p>
  <div class="card">
    <label for="pass">合言葉</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="合言葉を入れてね">
    <div class="row"><button class="b" id="passGo" type="button">ひらく</button></div>
    <div class="msg" id="keyMsg"></div>
  </div>
</section>

<!-- ホーム(タイル) -->
<section class="screen" id="home">
  <h1>HP更新ページ</h1>
  <p class="lead">ここから内容を更新できます。</p>
  <div class="tiles">
    <button class="tile" data-go="news" type="button"><i>📣</i>お知らせ<small>ニュース</small></button>
    <button class="tile" data-go="schedule" type="button"><i>📅</i>配信予定<small>曜日ごとの予定</small></button>
    <button class="tile" data-go="songs" type="button"><i>🎵</i>歌える曲<small>曲リスト</small></button>
    <button class="tile" data-go="works" type="button"><i>🎬</i>作品・動画<small>MV・アーカイブ</small></button>
    <button class="tile" data-go="profile" type="button"><i>👤</i>プロフィール<small>自己紹介の文</small></button>
    <button class="tile" data-go="inbox" type="button"><i>📮</i>受信箱<small>メッセージ・リクエスト</small><span class="n" id="inbN" hidden>0</span></button>
  </div>
  <div class="row" style="margin-top:22px"><button class="b ghost" id="logout" type="button">ログアウト</button></div>
  <p class="note" style="text-align:center"><a href="../" style="color:var(--pri)">HPを見る</a></p>
</section>

<!-- 一覧エディタ(お知らせ・配信予定・歌える曲・作品・動画) -->
<section class="screen" id="editor">
  <button class="back" type="button" data-go="home">← もどる</button>
  <h2 id="edTitle"></h2>
  <p class="note" id="edNote"></p>
  <div class="seg" id="edSeg" hidden></div>
  <div id="edBulk" hidden>
    <div class="card">
      <label>まとめて追加（1行に1曲。「曲名 / アーティスト / ジャンル」の形）</label>
      <textarea id="bulkTxt" placeholder="例）星降る夜に / オリジナル / オリジナル&#10;サンプル曲 / アーティスト名 / アニソン"></textarea>
      <div class="row"><button class="b ghost" id="bulkAdd" type="button">下の一覧に追加する</button></div>
    </div>
  </div>
  <div id="edList"></div>
  <div class="row"><button class="b ghost" id="edAdd" type="button">＋ 1件追加する</button></div>
  <div class="msg" id="edMsg"></div>
  <div class="save"><button class="b" id="edSave" type="button">保存してHPに出す</button></div>
  <div class="row"><button class="b ghost sm" id="edReset" type="button" style="flex:1">もとのサンプルに戻す</button></div>
</section>

<!-- プロフィール -->
<section class="screen" id="profile">
  <button class="back" type="button" data-go="home">← もどる</button>
  <h2>プロフィール</h2>
  <p class="note">HPの「PROFILE」に出る自己紹介の文です。改行もそのまま出ます。</p>
  <div class="card">
    <textarea id="pfTxt" maxlength="800" style="min-height:220px" placeholder="自己紹介を書いてね"></textarea>
    <div class="cnt"><span id="pfCnt">0</span> / 800</div>
  </div>
  <div class="msg" id="pfMsg"></div>
  <div class="save"><button class="b" id="pfSave" type="button">保存してHPに出す</button></div>
</section>

<!-- 受信箱 -->
<section class="screen" id="inbox">
  <button class="back" type="button" data-go="home">← もどる</button>
  <h2>受信箱</h2>
  <p class="note">HPから届いたメッセージ・曲のリクエスト・お問い合わせです。</p>
  <div class="seg" id="inbSeg"></div>
  <div id="inbList"></div>
  <div class="msg" id="inbMsg"></div>
  <div class="row"><button class="b ghost sm" id="inbClear" type="button" style="flex:1">「済み」をまとめて消す</button></div>
</section>

</div>

<script src="../data.js"></script>
<script>
(function(){
  var SB=CONFIG.sb.url+'/rest/v1/rpc/', SBKEY=CONFIG.sb.key, PK='enu_admin_pass';
  var $=function(id){return document.getElementById(id)};
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function getPass(){try{return localStorage.getItem(PK)||''}catch(e){return ''}}
  function setPass(v){try{v?localStorage.setItem(PK,v):localStorage.removeItem(PK)}catch(e){}}
  function say(el,t,err){el.textContent=t;el.classList.toggle('err',!!err)}

  function call(fn,body){
    body.p_pass=getPass();
    return fetch(SB+fn,{method:'POST',headers:{'apikey':SBKEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return null}).then(function(d){
        if(!r.ok){var e=new Error(d&&d.message==='auth'?'auth':(r.status===404?'nosetup':'net'));e.detail='HTTP '+r.status+(d&&d.message?' '+d.message:'');throw e}
        return d})},function(){var e=new Error('net');e.detail='fetch失敗';throw e});
  }
  function fail(e,el){
    if(e.message==='auth'){setPass('');show('key');say($('keyMsg'),'合言葉がちがうみたい。もう一度入れてね',true);return}
    if(e.message==='nosetup'){say(el,'まだ準備ができていません（Supabaseの設定が必要です）',true);return}
    say(el,'通信できなかったみたい。電波を確認してもう一度ためしてね'+(e.detail?'（'+e.detail+'）':''),true);
  }

  var cur='home', remote={}, inbox=[];
  function show(id){
    cur=id;[].forEach.call(document.querySelectorAll('.screen'),function(s){s.classList.toggle('on',s.id===id)});
    window.scrollTo(0,0);
  }
  function go(id){
    if(id==='home'){show('home');refreshCount();return}
    if(id==='inbox'){show('inbox');loadInbox();return}
    if(id==='profile'){show('profile');loadProfile();return}
    openEditor(id);
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

  /* ---- 合言葉 ---- */
  function enter(){
    var v=$('pass').value.trim();if(!v)return;setPass(v);say($('keyMsg'),'確認しています…');
    call('enu_admin',{p_action:'get'}).then(function(d){remote=d||{};$('pass').value='';say($('keyMsg'),'');go('home')},function(e){fail(e,$('keyMsg'))});
  }
  $('passGo').onclick=enter;
  $('pass').addEventListener('keydown',function(e){if(e.key==='Enter')enter()});
  $('logout').onclick=function(){setPass('');show('key')};

  /* ---- 一覧エディタ ---- */
  var TAGS=['お知らせ','配信','歌','イベント','グッズ','その他'];
  var PFS=['Mirrativ','YouTube','Twitch','TikTok','X','その他'];
  var DOWS=['月','火','水','木','金','土','日'];
  var COVERS=[['','水色'],['c2','青'],['c3','うすむらさき']];
  var GENRES=['オリジナル','バラード','アニソン','ボカロ','J-POP','その他'];
  function opts(list,val,pair){
    var arr=list.slice();var has=arr.some(function(x){return (pair?x[0]:x)===val});
    if(!has&&val!==''&&val!=null)arr.push(pair?[val,val]:val);
    return arr.map(function(x){var v=pair?x[0]:x,l=pair?x[1]:x;return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>'}).join('');
  }
  function dotToIso(d){var m=String(d||'').match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);return m?m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2):''}
  function isoToDot(i){return i?i.replace(/-/g,'.'):''}
  function todayIso(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}

  var KINDS={
    news:{title:'お知らせ',note:'新しいものが上に出ます。「上へ」で順番を変えられます。',
      blank:function(){return{d:isoToDot(todayIso()),tag:'お知らせ',t:'',s:''}},
      html:function(x){return '<label>日付</label><input type="date" data-f="d" value="'+esc(dotToIso(x.d))+'">'+
        '<label>種類</label><select data-f="tag">'+opts(TAGS,x.tag)+'</select>'+
        '<label>タイトル</label><input data-f="t" maxlength="60" value="'+esc(x.t)+'">'+
        '<label>ひとこと（説明）</label><input data-f="s" maxlength="120" value="'+esc(x.s)+'">'},
      read:function(c){return{d:isoToDot(c.d),tag:c.tag,t:c.t.trim(),s:c.s.trim()}},ok:function(x){return x.t}},
    schedule:{title:'配信予定',note:'毎週くりかえす予定です。曜日と時間と内容を入れてね。（今週のカレンダーに出ます）',
      blank:function(){return{dow:1,time:'21:00',pf:'Mirrativ',t:''}},
      html:function(x){return '<div class="two"><div><label>曜日</label><select data-f="dow">'+DOWS.map(function(n,i){return '<option value="'+(i+1)+'"'+((+x.dow)===i+1?' selected':'')+'>'+n+'曜日</option>'}).join('')+'</select></div>'+
        '<div><label>時間</label><input type="time" data-f="time" value="'+esc(x.time)+'"></div></div>'+
        '<label>どこで</label><select data-f="pf">'+opts(PFS,x.pf)+'</select>'+
        '<label>内容</label><input data-f="t" maxlength="50" value="'+esc(x.t)+'">'},
      read:function(c){return{dow:+c.dow,time:c.time||'00:00',pf:c.pf,t:c.t.trim()}},ok:function(x){return x.t}},
    songs:{title:'歌える曲',note:'「まとめて追加」で一気に足せます。ここで保存した内容が、HPの曲リストになります。',bulk:true,
      blank:function(){return{t:'',a:'',g:'オリジナル'}},
      html:function(x){return '<label>曲名</label><input data-f="t" maxlength="60" value="'+esc(x.t)+'">'+
        '<div class="two"><div><label>アーティスト</label><input data-f="a" maxlength="40" value="'+esc(x.a)+'"></div>'+
        '<div><label>ジャンル</label><select data-f="g">'+opts(GENRES,x.g)+'</select></div></div>'},
      read:function(c){return{t:c.t.trim(),a:c.a.trim(),g:c.g}},ok:function(x){return x.t}}
  };
  var MEDIA=function(label){return {title:label,
      blank:function(){return{t:'',s:'',u:'',c:''}},
      html:function(x){return '<label>タイトル</label><input data-f="t" maxlength="50" value="'+esc(x.t)+'">'+
        '<label>ひとこと（例: YouTube / 12分）</label><input data-f="s" maxlength="60" value="'+esc(x.s)+'">'+
        '<label>リンク（あれば。https:// から）</label><input data-f="u" type="url" inputmode="url" value="'+esc(x.u||'')+'" placeholder="https://">'+
        '<label>サムネの色</label><select data-f="c">'+opts(COVERS,x.c||'',true)+'</select>'},
      read:function(c){var u=c.u.trim();return{t:c.t.trim(),s:c.s.trim(),u:/^https:\/\//.test(u)?u:'',c:c.c}},ok:function(x){return x.t}}};
  KINDS.works=MEDIA('楽曲・作品');KINDS.videos=MEDIA('MV・歌唱動画');KINDS.archive=MEDIA('アーカイブ');
  var MEDIA_SEG=[['works','楽曲・作品'],['videos','MV・歌唱動画'],['archive','アーカイブ']];

  var ek=null, items=[];
  function listOf(k){return Array.isArray(remote[k])?remote[k]:DATA[k].map(function(x){return Object.assign({},x)})}
  function openEditor(k){
    var group=(k==='works'||k==='videos'||k==='archive');
    ek=k;var K=KINDS[k];
    $('edTitle').textContent=group?'作品・動画':K.title;
    $('edNote').textContent=K.note||'リンクを入れると、タップでその動画・ページが開きます。';
    var seg=$('edSeg');seg.hidden=!group;
    if(group){seg.innerHTML=MEDIA_SEG.map(function(p){return '<button type="button" data-k="'+p[0]+'" aria-pressed="'+(p[0]===k)+'">'+p[1]+'</button>'}).join('')}
    $('edBulk').hidden=!K.bulk;
    items=listOf(k);
    if(!Array.isArray(remote[k]))say($('edMsg'),'まだ更新していないので、今は「サンプル」が出ています。書き換えて保存すると本物に変わります。');else say($('edMsg'),'');
    drawList();show('editor');
  }
  $('edSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(!confirm('いまの編集内容は保存されていなければ消えます。切り替える？'))return;openEditor(b.dataset.k)});
  function collect(){
    var K=KINDS[ek],out=[];
    [].forEach.call($('edList').querySelectorAll('.card'),function(card){
      var c={};[].forEach.call(card.querySelectorAll('[data-f]'),function(el){c[el.dataset.f]=el.value});
      out.push(K.read(c));
    });return out;
  }
  function drawList(){
    var K=KINDS[ek],box=$('edList');
    if(!items.length){box.innerHTML='<div class="empty">まだ何もありません。「＋1件追加する」から入れてね</div>';return}
    box.innerHTML=items.map(function(x,i){
      return '<div class="card" data-i="'+i+'">'+K.html(x)+'<div class="tools"><button class="b ghost sm" data-a="up" type="button">↑上へ</button><button class="b ghost sm" data-a="down" type="button">↓下へ</button><button class="b ng sm" data-a="del" type="button">消す</button></div></div>';
    }).join('');
  }
  $('edList').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    items=collect();var i=+b.closest('.card').dataset.i;
    if(b.dataset.a==='del'){if(!confirm('この1件を消す？（保存するまでHPは変わりません）'))return;items.splice(i,1)}
    if(b.dataset.a==='up'&&i>0){var t=items[i];items[i]=items[i-1];items[i-1]=t}
    if(b.dataset.a==='down'&&i<items.length-1){var t2=items[i];items[i]=items[i+1];items[i+1]=t2}
    drawList();
  });
  $('edAdd').onclick=function(){
    items=collect();items.unshift(KINDS[ek].blank());drawList();
    var f=$('edList').querySelector('input[data-f="t"]');if(f)f.focus();
  };
  $('bulkAdd').onclick=function(){
    var lines=$('bulkTxt').value.split(/\n/).map(function(s){return s.trim()}).filter(Boolean);
    if(!lines.length)return;items=collect();var n=0;
    lines.forEach(function(l){var p=l.split(/\s*[\/／]\s*/);items.push({t:p[0]||'',a:p[1]||'',g:p[2]||'オリジナル'});n++});
    $('bulkTxt').value='';drawList();say($('edMsg'),n+'件を一覧の下に追加しました。「保存してHPに出す」を押すと反映されます。');
  };
  $('edSave').onclick=function(){
    var K=KINDS[ek],data=collect().filter(K.ok),btn=$('edSave');
    if(ek==='songs'){ // 同じ曲名+アーティストの重複を1つにする
      var seen={};data=data.filter(function(x){var k=x.t+'\u0001'+x.a;if(seen[k])return false;seen[k]=1;return true});
    }
    btn.disabled=true;say($('edMsg'),'保存しています…');
    call('enu_admin',{p_action:'save',p_key:ek,p_data:data}).then(function(d){
      remote=d||{};items=listOf(ek);drawList();btn.disabled=false;say($('edMsg'),'保存しました！HPにすぐ出ます（開いている人は読み込み直すと変わります）');
    },function(e){btn.disabled=false;fail(e,$('edMsg'))});
  };
  $('edReset').onclick=function(){
    if(!confirm('保存した内容を消して、最初のサンプルに戻す？'))return;
    call('enu_admin',{p_action:'reset',p_key:ek}).then(function(d){remote=d||{};openEditor(ek);say($('edMsg'),'サンプルに戻しました')},function(e){fail(e,$('edMsg'))});
  };

  /* ---- プロフィール ---- */
  function loadProfile(){
    var t=remote.profile&&remote.profile.text||'';$('pfTxt').value=t;$('pfCnt').textContent=t.length;say($('pfMsg'),'');
  }
  $('pfTxt').addEventListener('input',function(){$('pfCnt').textContent=$('pfTxt').value.length});
  $('pfSave').onclick=function(){
    var btn=$('pfSave');btn.disabled=true;say($('pfMsg'),'保存しています…');
    var t=$('pfTxt').value.trim();
    call('enu_admin',t?{p_action:'save',p_key:'profile',p_data:{text:t}}:{p_action:'reset',p_key:'profile'}).then(function(d){
      remote=d||{};btn.disabled=false;say($('pfMsg'),t?'保存しました！HPにすぐ出ます':'空にしたので「準備中」の表示に戻りました');
    },function(e){btn.disabled=false;fail(e,$('pfMsg'))});
  };

  /* ---- 受信箱 ---- */
  var KIND_NAME={message:['メッセージ','k'],request:['リクエスト','k req'],contact:['お問い合わせ','k ct']};
  var filt='all';
  function fmt(iso){var d=new Date(iso);return isNaN(d)?'':(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2)}
  function drawInbox(){
    var seg=[['all','すべて'],['message','メッセージ'],['request','リクエスト'],['contact','お問い合わせ']];
    $('inbSeg').innerHTML=seg.map(function(p){return '<button type="button" data-f="'+p[0]+'" aria-pressed="'+(filt===p[0])+'">'+p[1]+'</button>'}).join('');
    var list=inbox.filter(function(r){return filt==='all'||r.kind===filt});
    if(!list.length){$('inbList').innerHTML='<div class="empty">まだ届いていません</div>';return}
    $('inbList').innerHTML=list.map(function(r){
      var kn=KIND_NAME[r.kind]||['',''];
      return '<div class="card inb'+(r.done?' done':'')+'"><span class="'+kn[1]+'">'+kn[0]+'</span><span class="t">'+fmt(r.created_at)+'</span>'+
        (r.name||r.contact?'<div class="t" style="margin-top:4px">'+esc(r.name||'')+(r.contact?'　'+esc(r.contact):'')+'</div>':'')+
        '<p>'+esc(r.body)+'</p><div class="tools"><button class="b ghost sm" data-id="'+r.id+'" data-a="done" data-v="'+(r.done?'0':'1')+'" type="button">'+(r.done?'未読にもどす':'済みにする')+'</button>'+
        '<button class="b ng sm" data-id="'+r.id+'" data-a="del" type="button">消す</button></div></div>';
    }).join('');
  }
  function setInbox(d){inbox=d||[];drawInbox();refreshCount(true)}
  function loadInbox(){say($('inbMsg'),'');call('enu_inbox_admin',{p_action:'list'}).then(setInbox,function(e){$('inbList').innerHTML='<div class="empty">読み込めませんでした</div>';fail(e,$('inbMsg'))})}
  $('inbSeg').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;filt=b.dataset.f;drawInbox()});
  $('inbList').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;
    if(b.dataset.a==='del'){
      if(!confirm('これを消す？（もとにもどせません）'))return;
      call('enu_inbox_admin',{p_action:'delete',p_id:+b.dataset.id}).then(setInbox,function(er){fail(er,$('inbMsg'))});
    }else{
      call('enu_inbox_admin',{p_action:'done',p_id:+b.dataset.id,p_value:b.dataset.v==='1'}).then(setInbox,function(er){fail(er,$('inbMsg'))});
    }
  });
  $('inbClear').onclick=function(){
    if(!confirm('「済み」にしたものをぜんぶ消す？（もとにもどせません）'))return;
    call('enu_inbox_admin',{p_action:'clear_done'}).then(function(d){setInbox(d);say($('inbMsg'),'消しました')},function(e){fail(e,$('inbMsg'))});
  };
  function refreshCount(fromList){
    var apply=function(list){var n=list.filter(function(r){return !r.done}).length;$('inbN').hidden=!n;$('inbN').textContent=n};
    if(fromList){apply(inbox);return}
    call('enu_inbox_admin',{p_action:'list'}).then(function(d){inbox=d||[];apply(inbox)},function(){});
  }

  /* ---- 起動 ---- */
  if(getPass()){
    show('key');say($('keyMsg'),'確認しています…');
    call('enu_admin',{p_action:'get'}).then(function(d){remote=d||{};say($('keyMsg'),'');go('home')},function(e){say($('keyMsg'),'');fail(e,$('keyMsg'))});
  }else show('key');
})();
</script>
</body>
</html>
